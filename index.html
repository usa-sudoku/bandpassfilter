<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klavier Schwebungs-Isolator (Frequenzfenster)</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #00d26a;
      --accent-disabled: #3a5043;
      --text: #ececec;
      --subtext: #a0a0ab;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .app-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: var(--accent);
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #000;
      transition: all 0.2s ease;
    }

    button:disabled {
      background: var(--accent-disabled);
      color: #666;
      cursor: not-allowed;
    }

    button.recording {
      background: #ff4757;
      color: #fff;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .input-group input[type=number] {
      background: #121214;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    .input-group input[type=number]:focus {
      outline: 1px solid var(--accent);
    }

    canvas {
      width: 100%;
      height: 180px;
      background: #000;
      border-radius: 8px;
      margin-top: 10px;
      display: block;
    }

    .status {
      font-size: 0.85rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Klavier Bandpass-Filter (Min/Max Fenster)</h1>

  <div class="controls">
    <button id="recordBtn">🎤 Aufnahme starten</button>
    <button id="playBtn" disabled>▶ Gefiltert abspielen</button>
  </div>

  <!-- Frequenzfenster Eingabefelder -->
  <div class="inputs-grid">
    <div class="input-group">
      <label for="minFreq">Min. Frequenz (Hz):</label>
      <input type="number" id="minFreq" value="430" min="20" max="8000" step="1">
    </div>
    <div class="input-group">
      <label for="maxFreq">Max. Frequenz (Hz):</label>
      <input type="number" id="maxFreq" value="450" min="20" max="8000" step="1">
    </div>
  </div>

  <canvas id="visualizer"></canvas>
  <div class="status" id="statusText">Bereit für Aufnahme.</div>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let audioBlob;
  let audioCtx;
  let audioBuffer;
  let currentSource = null;
  let highpassNode;
  let lowpassNode;
  let analyserNode;
  let animId;

  const recordBtn = document.getElementById('recordBtn');
  const playBtn = document.getElementById('playBtn');
  const minFreqInput = document.getElementById('minFreq');
  const maxFreqInput = document.getElementById('maxFreq');
  const statusText = document.getElementById('statusText');
  const canvas = document.getElementById('visualizer');
  const canvasCtx = canvas.getContext('2d');

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  // Live-Update der Filterfrequenzen, falls während des Abspielens geändert wird
  minFreqInput.addEventListener('input', () => {
    if (highpassNode && audioCtx) {
      highpassNode.frequency.setValueAtTime(parseFloat(minFreqInput.value), audioCtx.currentTime);
    }
  });

  maxFreqInput.addEventListener('input', () => {
    if (lowpassNode && audioCtx) {
      lowpassNode.frequency.setValueAtTime(parseFloat(maxFreqInput.value), audioCtx.currentTime);
    }
  });

  // Aufnahme Steuerung
  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      recordBtn.textContent = "🎤 Aufnahme starten";
      recordBtn.classList.remove('recording');
      statusText.textContent = "Verarbeite Aufnahme...";
    } else {
      audioChunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const arrayBuffer = await audioBlob.arrayBuffer();
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          playBtn.disabled = false;
          statusText.textContent = "Aufnahme bereit zum Abspielen.";
        };

        mediaRecorder.start();
        recordBtn.textContent = "⏹ Stopp (Aufnahme...)";
        recordBtn.classList.add('recording');
        statusText.textContent = "Nimm Klavierton auf...";
      } catch (err) {
        alert("Mikrofonzugriff verweigert oder nicht verfügbar.");
        console.error(err);
      }
    }
  });

  // Gefiltertes Abspielen
  playBtn.addEventListener('click', () => {
    if (!audioBuffer) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (currentSource) {
      currentSource.stop();
    }

    const minFreq = parseFloat(minFreqInput.value);
    const maxFreq = parseFloat(maxFreqInput.value);

    if (minFreq >= maxFreq) {
      alert("Min. Frequenz muss kleiner sein als Max. Frequenz!");
      return;
    }

    currentSource = audioCtx.createBufferSource();
    currentSource.buffer = audioBuffer;

    // Filter 1: Hochpass (blockt alles unter Min-Freq)
    highpassNode = audioCtx.createBiquadFilter();
    highpassNode.type = 'highpass';
    highpassNode.frequency.setValueAtTime(minFreq, audioCtx.currentTime);

    // Filter 2: Tiefpass (blockt alles über Max-Freq)
    lowpassNode = audioCtx.createBiquadFilter();
    lowpassNode.type = 'lowpass';
    lowpassNode.frequency.setValueAtTime(maxFreq, audioCtx.currentTime);

    // Analyser für Visualisierung
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 2048;

    // Signalkette: Source -> Highpass -> Lowpass -> Analyser -> Output
    currentSource.connect(highpassNode);
    highpassNode.connect(lowpassNode);
    lowpassNode.connect(analyserNode);
    analyserNode.connect(audioCtx.destination);

    currentSource.start(0);
    statusText.textContent = `Spiele Fensterbereich [${minFreq} Hz - ${maxFreq} Hz] ab...`;

    drawVisualizer();

    currentSource.onended = () => {
      statusText.textContent = "Wiedergabe beendet.";
      cancelAnimationFrame(animId);
    };
  });

  // Spektrometer
  function drawVisualizer() {
    const bufferLength = analyserNode.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function renderFrame() {
      animId = requestAnimationFrame(renderFrame);
      analyserNode.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = `rgb(0, ${dataArray[i] + 100}, 106)`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

        x += barWidth + 1;
      }
    }

    renderFrame();
  }
</script>

</body>
</html>
