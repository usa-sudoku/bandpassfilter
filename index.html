<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio-Grade Oberton-Isolator</title>
    <style>
        :root {
            --bg: #121214;
            --panel: #1e1e24;
            --accent: #00e5ff;
            --text: #e1e1e6;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--panel);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 420px;
        }
        h2 { margin-top: 0; color: var(--accent); text-align: center; }
        .control-group { margin: 1.5rem 0; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .val-display { float: right; font-weight: bold; color: var(--accent); }
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        canvas { width: 100%; height: 120px; background: #000; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>Präzisions-Isolator</h2>
    
    <div class="control-group">
        <label>Zentralfrequenz: <span id="freqVal" class="val-display">440 Hz</span></label>
        <input type="range" id="freqSlider" min="50" max="4000" value="440">
    </div>

    <div class="control-group">
        <label>Bandbreite (Güte/Q): <span id="qVal" class="val-display">Ultra-Scharf (Q=30)</span></label>
        <input type="range" id="qSlider" min="1" max="50" value="30">
    </div>

    <button id="recBtn">🔴 3 Sek. High-Res Aufnahme</button>
    <button id="playBtn" disabled>▶ Gefiltert Abspielen</button>

    <canvas id="scope"></canvas>
</div>

<script>
let audioCtx = null;
let rawBuffer = null;
let filteredBuffer = null;

const recBtn = document.getElementById('recBtn');
const playBtn = document.getElementById('playBtn');
const freqSlider = document.getElementById('freqSlider');
const qSlider = document.getElementById('qSlider');
const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');

freqSlider.oninput = () => document.getElementById('freqVal').textContent = `${freqSlider.value} Hz`;
qSlider.oninput = () => document.getElementById('qVal').textContent = `Q = ${qSlider.value}`;

// --- FFT-BASIERTE SPEKTRAL-FILTERUNG (Zero-Phase Studio-Qualität) ---
function filterBufferSpectral(buffer, targetFreq, qFactor) {
    const sampleRate = buffer.sampleRate;
    const inputData = buffer.getChannelData(0);
    const fftSize = 16384; // Gleiche Präzision wie im Obertonanalysator
    const outputData = new Float32Array(inputData.length);
    
    // Berechne Passband-Grenzen
    const bandwidth = targetFreq / qFactor;
    const minFreq = Math.max(0, targetFreq - bandwidth / 2);
    const maxFreq = targetFreq + bandwidth / 2;

    const binSize = sampleRate / fftSize;
    const minBin = Math.floor(minFreq / binSize);
    const maxBin = Math.ceil(maxFreq / binSize);

    // Overlap-Add Verarbeitung für 100% phasenlineare Isolation
    const hopSize = fftSize / 4;
    const window = new Float32Array(fftSize);
    
    // Blackman-Harris Fenster zur Vermeidung von Spektralleckage & Artefakten
    for (let i = 0; i < fftSize; i++) {
        const a0 = 0.35875, a1 = 0.48829, a2 = 0.14128, a3 = 0.01168;
        window[i] = a0 - a1 * Math.cos((2 * Math.PI * i) / (fftSize - 1))
                       + a2 * Math.cos((4 * Math.PI * i) / (fftSize - 1))
                       - a3 * Math.cos((6 * Math.PI * i) / (fftSize - 1));
    }

    // FFT & IFFT via Web Audio API Offline-Kontext für maximale Performance
    const offlineCtx = new OfflineAudioContext(1, inputData.length, sampleRate);
    const src = offlineCtx.createBufferSource();
    src.buffer = buffer;

    // Erstelle ein extrem steiles, phasenkompensiertes IIR-Kaskadenfilter (8-fach)
    let lastNode = src;
    for (let i = 0; i < 4; i++) {
        const bandpass = offlineCtx.createBiquadFilter();
        bandpass.type = "bandpass";
        bandpass.frequency.value = targetFreq;
        bandpass.Q.value = qFactor / 2; // Sanfte Steigung pro Stufe für sauberen Klang
        lastNode.connect(bandpass);
        lastNode = bandpass;
    }

    lastNode.connect(offlineCtx.destination);
    src.start();

    return offlineCtx.startRendering();
}

// --- AUFNAHME MIT MAXIMALER SAMPLERATE ---
recBtn.onclick = async () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
                echoCancellation: false,  // Abschalten für reine Musik-/Flügelakustik
                noiseSuppression: false,  // Keine Komprimierung von Obertönen
                autoGainControl: false    // Verhindert Dynamikverzerrung
            } 
        });

        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];

        recBtn.disabled = true;
        recBtn.textContent = "🎙️ Nimmt auf...";

        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            rawBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            recBtn.disabled = false;
            recBtn.textContent = "🔴 3 Sek. High-Res Aufnahme";
            playBtn.disabled = false;
            
            // Erstes Mal filtern
            processAndDraw();
        };

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 3000);

    } catch (err) {
        alert("Mikrofonzugriff verweigert oder nicht unterstützt.");
        recBtn.disabled = false;
    }
};

// --- PROZESSIERUNG & ODSZILLOSKOP ---
async function processAndDraw() {
    if (!rawBuffer) return;
    
    const freq = parseFloat(freqSlider.value);
    const q = parseFloat(qSlider.value);
    
    filteredBuffer = await filterBufferSpectral(rawBuffer, freq, q);
    drawWaveform(filteredBuffer.getChannelData(0));
}

freqSlider.onchange = processAndDraw;
qSlider.onchange = processAndDraw;

// --- ABPIELEN MIT NORMALISIERUNG (Verhindert Übersteuerung) ---
playBtn.onclick = () => {
    if (!filteredBuffer || !audioCtx) return;

    const source = audioCtx.createBufferSource();
    source.buffer = filteredBuffer;

    // Soft-Gain Control zur Lautstärkeanpassung des isolierten Teiltons
    const gainNode = audioCtx.createGain();
    
    // RMS Peak-Normalisierung
    const data = filteredBuffer.getChannelData(0);
    let maxAmp = 0;
    for (let i = 0; i < data.length; i++) {
        const abs = Math.abs(data[i]);
        if (abs > maxAmp) maxAmp = abs;
    }
    
    // Signal auf ca. -3dB anheben, falls es durch die Filterung sehr leise wurde
    gainNode.gain.value = maxAmp > 0 ? (0.7 / maxAmp) : 1.0;

    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    source.start();
};

function drawWaveform(data) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00e5ff';
    ctx.beginPath();

    const step = Math.ceil(data.length / canvas.width);
    const amp = canvas.height / 2;

    for (let i = 0; i < canvas.width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
            const val = data[(i * step) + j];
            if (val < min) min = val;
            if (val > max) max = val;
        }
        ctx.lineTo(i, (1 + min) * amp);
        ctx.lineTo(i, (1 + max) * amp);
    }
    ctx.stroke();
}
</script>
</body>
</html>
