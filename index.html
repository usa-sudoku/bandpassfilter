<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klavier Schwebungs-Isolator HD</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #00d26a;
      --accent-disabled: #3a5043;
      --text: #ececec;
      --subtext: #a0a0ab;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .app-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: var(--accent);
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #000;
      transition: all 0.2s ease;
    }

    button:disabled {
      background: var(--accent-disabled);
      color: #666;
      cursor: not-allowed;
    }

    button.recording {
      background: #ff4757;
      color: #fff;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .input-group input[type=number], select {
      background: #121214;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    .input-group input[type=number]:focus, select:focus {
      outline: 1px solid var(--accent);
    }

    .slope-group {
      margin-bottom: 20px;
    }

    canvas {
      width: 100%;
      height: 180px;
      background: #000;
      border-radius: 8px;
      margin-top: 10px;
      display: block;
    }

    .status {
      font-size: 0.85rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Klavier Bandpass-Filter (HD Studio)</h1>

  <div class="controls">
    <button id="recordBtn">🎤 Aufnahme starten</button>
    <button id="playBtn" disabled>▶ Gefiltert abspielen</button>
  </div>

  <!-- Frequenzfenster -->
  <div class="inputs-grid">
    <div class="input-group">
      <label for="minFreq">Min. Frequenz (Hz):</label>
      <input type="number" id="minFreq" value="430" min="20" max="8000" step="1">
    </div>
    <div class="input-group">
      <label for="maxFreq">Max. Frequenz (Hz):</label>
      <input type="number" id="maxFreq" value="450" min="20" max="8000" step="1">
    </div>
  </div>

  <!-- Flankensteilheit (Filter-Stärke) -->
  <div class="input-group slope-group">
    <label for="steepnessSelect">Filter-Steilheit (Abschneid-Stärke):</label>
    <select id="steepnessSelect">
      <option value="1">12 dB/Okt (Weich - breiter Übergang)</option>
      <option value="2">24 dB/Okt (Mittel - ausgewogen)</option>
      <option value="3">36 dB/Okt (Stark - gute Isolation)</option>
      <option value="4" selected>48 dB/Okt (Rigoros - maximale Isolation)</option>
    </select>
  </div>

  <canvas id="visualizer"></canvas>
  <div class="status" id="statusText">Bereit für Aufnahme.</div>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let audioBlob;
  let audioCtx;
  let audioBuffer;
  let currentSource = null;
  let analyserNode;
  let animId;

  const recordBtn = document.getElementById('recordBtn');
  const playBtn = document.getElementById('playBtn');
  const minFreqInput = document.getElementById('minFreq');
  const maxFreqInput = document.getElementById('maxFreq');
  const steepnessSelect = document.getElementById('steepnessSelect');
  const statusText = document.getElementById('statusText');
  const canvas = document.getElementById('visualizer');
  const canvasCtx = canvas.getContext('2d');

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  // Aufnahme Steuerung mit Unprocessed HD Hardware-Audio
  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      recordBtn.textContent = "🎤 Aufnahme starten";
      recordBtn.classList.remove('recording');
      statusText.textContent = "Verarbeite HD-Aufnahme...";
    } else {
      audioChunks = [];
      try {
        // High-End Mikrofonkonfiguration: Alle Filter deaktivieren für rohes Signal
        const audioConstraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1,
            sampleRate: 48000
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
        
        let mimeType = 'audio/webm;codecs=opus';
        if (MediaRecorder.isTypeSupported('audio/wav')) {
          mimeType = 'audio/wav';
        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
          mimeType = 'audio/webm';
        }

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: mimeType,
          audioBitsPerSecond: 256000
        });
        
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          audioBlob = new Blob(audioChunks, { type: mimeType });
          const arrayBuffer = await audioBlob.arrayBuffer();
          
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
          }
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          playBtn.disabled = false;
          statusText.textContent = "Aufnahme bereit zum Abspielen.";

          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        recordBtn.textContent = "⏹ Stopp (Aufnahme...)";
        recordBtn.classList.add('recording');
        statusText.textContent = "Nimm Klavierton auf...";
      } catch (err) {
        alert("Mikrofonzugriff verweigert oder Konfiguration nicht unterstützt.");
        console.error(err);
      }
    }
  });

  // Gefiltertes Abspielen ohne Pegeländerung
  playBtn.addEventListener('click', () => {
    if (!audioBuffer) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
    }

    const minFreq = parseFloat(minFreqInput.value);
    const maxFreq = parseFloat(maxFreqInput.value);
    const cascades = parseInt(steepnessSelect.value);

    if (minFreq >= maxFreq) {
      alert("Min. Frequenz muss kleiner sein als Max. Frequenz!");
      return;
    }

    currentSource = audioCtx.createBufferSource();
    currentSource.buffer = audioBuffer;

    let lastNode = currentSource;

    // Hochpass-Kaskade
    for (let i = 0; i < cascades; i++) {
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(minFreq, audioCtx.currentTime);
      lastNode.connect(hp);
      lastNode = hp;
    }

    // Tiefpass-Kaskade
    for (let i = 0; i < cascades; i++) {
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(maxFreq, audioCtx.currentTime);
      lastNode.connect(lp);
      lastNode = lp;
    }

    // Analyser für Visualisierung
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 2048;

    lastNode.connect(analyserNode);
    analyserNode.connect(audioCtx.destination);

    currentSource.start(0);
    statusText.textContent = `Spiele Fenster [${minFreq}–${maxFreq} Hz] mit ${cascades * 12} dB/Okt Steilheit ab...`;

    drawVisualizer();

    currentSource.onended = () => {
      statusText.textContent = "Wiedergabe beendet.";
      cancelAnimationFrame(animId);
    };
  });

  // Spektrometer
  function drawVisualizer() {
    const bufferLength = analyserNode.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function renderFrame() {
      animId = requestAnimationFrame(renderFrame);
      analyserNode.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = `rgb(0, ${Math.min(255, dataArray[i] + 100)}, 106)`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

        x += barWidth + 1;
      }
    }

    renderFrame();
  }
</script>

</body>
</html>
